<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAYED ISLAM • 3D BIO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#02030a;color:#fff;display:grid;place-items:center}
#stars{position:fixed;inset:0;width:100%;height:100%}
.orb{position:fixed;border-radius:50%;filter:blur(45px);opacity:.45;pointer-events:none}
.o1{width:220px;height:220px;background:#ff2388;left:-70px;top:8%;animation:a 7s infinite alternate}
.o2{width:260px;height:260px;background:#5b4cff;right:-80px;bottom:5%;animation:b 8s infinite alternate}
@keyframes a{to{transform:translate(90px,130px) scale(1.2)}}@keyframes b{to{transform:translate(-80px,-120px) scale(.8)}}
.scene{perspective:1100px;width:min(91vw,410px)}
.card{position:relative;text-align:center;padding:28px 22px 24px;border-radius:32px;
background:linear-gradient(145deg,#ffffff18,#ffffff06);border:1px solid #ffffff25;
box-shadow:0 30px 90px #000b,inset 0 1px #fff4;backdrop-filter:blur(18px);
transform-style:preserve-3d;transition:transform .12s ease-out;will-change:transform}
.ring{position:absolute;left:50%;top:112px;width:225px;height:225px;transform:translate(-50%,-50%) translateZ(5px);
border:1px solid #ff4fa555;border-radius:50%;box-shadow:0 0 28px #ff2c9666;animation:spin 9s linear infinite;pointer-events:none}
.ring:after{content:"";position:absolute;inset:14px;border:1px dashed #58e7ff66;border-radius:50%;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) translateZ(5px) rotate(360deg)}}
.avatar{position:relative;width:170px;height:170px;margin:0 auto 20px;border-radius:50%;padding:6px;
background:conic-gradient(#ff2f92,#6c5cff,#00eaff,#ff2f92);box-shadow:0 0 40px #a34dff88;
transform:translateZ(70px);animation:float 3s ease-in-out infinite}
.avatar:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid #fff3;animation:pulse 2s infinite}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
@keyframes float{50%{transform:translateZ(70px) translateY(-8px)}}@keyframes pulse{50%{transform:scale(1.08);opacity:.25}}
h1{margin:0;font-size:31px;letter-spacing:3px;text-shadow:0 0 20px #9d73ff;transform:translateZ(55px)}
.sub{margin:9px 0 18px;color:#ffbfdc;font-size:15px;transform:translateZ(42px)}
.badge{display:inline-block;padding:8px 15px;border-radius:99px;border:1px solid #ffffff25;background:#ffffff0e;
box-shadow:0 0 18px #ff9f1c22;color:#ffd166}
.music{transform:translateZ(40px);padding:13px;margin-top:5px;border-radius:20px;background:#0006;border:1px solid #ffffff15}
button{width:58px;height:58px;border:0;border-radius:50%;font-size:22px;color:#fff;cursor:pointer;
background:linear-gradient(135deg,#ff2f92,#654cff);box-shadow:0 8px 28px #0009}
button:active{transform:scale(.9)}.title{font-size:12px;color:#aaa;margin-top:8px}
.hint{margin-top:18px;font-size:11px;color:#777}
#enter{position:fixed;inset:0;display:grid;place-items:center;background:#02030a;z-index:5}
.enterBtn{width:auto;height:auto;border-radius:18px;padding:14px 24px;font-size:15px}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="orb o1"></div><div class="orb o2"></div>

<div id="enter"><button class="enterBtn" id="start">ENTER 3D BIO ✨</button></div>

<div class="scene">
 <div class="card" id="card">
  <div class="ring"></div>
  <div class="avatar"><img src="407.jpg" alt="SAYED ISLAM"></div>
  <h1>SAYED ISLAM</h1>
  <div class="sub">BIO. <span class="badge">Candy Lover 🟠</span></div>
  <div class="music">
   <button id="play">▶</button>
   <div class="title">MY MUSIC</div>
   <audio id="audio" src="song.mp3" preload="metadata"></audio>
  </div>
  <div class="hint">Touch / move your finger for 3D effect ✨</div>
 </div>
</div>

<script>
const c=document.getElementById('card'), audio=document.getElementById('audio'), play=document.getElementById('play');
const enter=document.getElementById('enter'), start=document.getElementById('start');
start.onclick=()=>{enter.style.display='none';audio.play().then(()=>play.textContent='❚❚').catch(()=>{})};
play.onclick=()=>{if(audio.paused){audio.play();play.textContent='❚❚'}else{audio.pause();play.textContent='▶'}};
audio.onended=()=>play.textContent='▶';

function tilt(x,y){
 const r=c.getBoundingClientRect(),dx=(x-r.left-r.width/2)/(r.width/2),dy=(y-r.top-r.height/2)/(r.height/2);
 c.style.transform=`rotateX(${-dy*10}deg) rotateY(${dx*10}deg) translateZ(8px)`;
}
addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));
addEventListener('touchmove',e=>{let t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});
addEventListener('mouseleave',()=>c.style.transform='');

const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let pts=[];
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
pts=Array.from({length:Math.min(100,Math.floor(innerWidth/4))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,s:Math.random()*.5+.15}))}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){p.y-=p.s;if(p.y<0)p.y=innerHeight;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(255,255,255,.65)';ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
