<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAYED ISLAM • 3D BIO</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,sans-serif;background:#02030a;color:#fff;display:grid;place-items:center}
#stars{position:fixed;inset:0;width:100%;height:100%}
.orb{position:fixed;border-radius:50%;filter:blur(45px);opacity:.45;pointer-events:none}
.o1{width:220px;height:220px;background:#ff2388;left:-70px;top:8%;animation:a 7s infinite alternate}
.o2{width:260px;height:260px;background:#5b4cff;right:-80px;bottom:5%;animation:b 8s infinite alternate}
@keyframes a{to{transform:translate(90px,130px) scale(1.2)}}@keyframes b{to{transform:translate(-80px,-120px) scale(.8)}}
.scene{perspective:1100px;width:min(91vw,410px)}
.card{position:relative;text-align:center;padding:28px 22px 24px;border-radius:32px;background:linear-gradient(145deg,#ffffff18,#ffffff06);border:1px solid #ffffff25;box-shadow:0 30px 90px #000b,inset 0 1px #fff4;backdrop-filter:blur(18px);transform-style:preserve-3d;transition:transform .12s ease-out;will-change:transform}
.ring{position:absolute;left:50%;top:112px;width:225px;height:225px;transform:translate(-50%,-50%) translateZ(5px);border:1px solid #ff4fa555;border-radius:50%;box-shadow:0 0 28px #ff2c9666;animation:spin 9s linear infinite;pointer-events:none}
.ring:after{content:"";position:absolute;inset:14px;border:1px dashed #58e7ff66;border-radius:50%;animation:spin 6s linear infinite reverse}
@keyframes spin{to{transform:translate(-50%,-50%) translateZ(5px) rotate(360deg)}}
.avatar{position:relative;width:170px;height:170px;margin:0 auto 20px;border-radius:50%;padding:6px;background:conic-gradient(#ff2f92,#6c5cff,#00eaff,#ff2f92);box-shadow:0 0 40px #a34dff88;transform:translateZ(70px);animation:float 3s ease-in-out infinite}
.avatar:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:1px solid #fff3;animation:pulse 2s infinite}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
@keyframes float{50%{transform:translateZ(70px) translateY(-8px)}}@keyframes pulse{50%{transform:scale(1.08);opacity:.25}}

h1{margin:0;font-size:31px;letter-spacing:3px;font-weight:900;transform:translateZ(55px);background:linear-gradient(90deg,#00eaff,#fff,#ff2f92,#8a5cff,#00eaff);background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 18px #8a5cff88;animation:nameGlow 4s linear infinite,nameFloat 2.8s ease-in-out infinite}
@keyframes nameGlow{to{background-position:300% center}}
@keyframes nameFloat{50%{transform:translateZ(70px) translateY(-3px) scale(1.025)}}

.sub{margin:10px 0 18px;color:#ffbfdc;font-size:15px;transform:translateZ(42px)}
.fireBio{position:relative;display:inline-block;padding:10px 18px 11px;border-radius:18px;border:1px solid #ff8a1833;background:linear-gradient(180deg,#ff5a0018,#ff160008);box-shadow:0 0 20px #ff4d002b,inset 0 0 18px #ff7a0010;overflow:visible}
.fireText{position:relative;z-index:2;font-size:15px;font-weight:700;letter-spacing:.3px;background:linear-gradient(90deg,#fff3a1,#ffcf33,#ff7a00,#fff3a1);background-size:250% auto;-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 12px #ff6a00aa;animation:fireText 2.2s linear infinite}
@keyframes fireText{to{background-position:250% center}}
.flame{position:absolute;z-index:1;bottom:-7px;width:12px;height:20px;background:linear-gradient(to top,#ff3b00,#ff9d00,#fff4a3);border-radius:50% 50% 45% 45%;filter:blur(.4px);opacity:.9;transform-origin:bottom center;animation:flicker .55s ease-in-out infinite alternate;box-shadow:0 0 10px #ff5a00}
.flame:nth-child(1){left:8%;height:18px;animation-delay:.05s}.flame:nth-child(2){left:18%;height:25px;animation-delay:.18s}.flame:nth-child(3){left:29%;height:16px;animation-delay:.35s}.flame:nth-child(4){left:41%;height:27px;animation-delay:.1s}.flame:nth-child(5){left:53%;height:19px;animation-delay:.28s}.flame:nth-child(6){left:65%;height:25px;animation-delay:.42s}.flame:nth-child(7){left:77%;height:17px;animation-delay:.16s}.flame:nth-child(8){left:88%;height:23px;animation-delay:.32s}
@keyframes flicker{0%{transform:scaleX(.7) scaleY(.8) translateY(2px);opacity:.65}50%{transform:scaleX(1.1) scaleY(1.15) translateY(-3px);opacity:1}100%{transform:scaleX(.75) scaleY(.9) translateY(1px);opacity:.75}}

.socials{display:flex;gap:9px;justify-content:center;margin:0 0 14px;transform:translateZ(38px)}
.social{flex:1;max-width:155px;padding:9px 8px;border-radius:14px;text-decoration:none;color:#fff;font-size:12px;font-weight:700;border:1px solid #ffffff22;background:#0007;box-shadow:0 0 16px #0008;transition:.25s}
.social:hover{transform:translateY(-3px);box-shadow:0 0 22px #00eaff55}
.fb{border-color:#1877f255;background:linear-gradient(135deg,#1877f222,#0007)}.ig{border-color:#e1306c55;background:linear-gradient(135deg,#e1306c22,#0007)}
.music{transform:translateZ(40px);padding:13px;margin-top:5px;border-radius:20px;background:#0006;border:1px solid #ffffff15}
button{width:58px;height:58px;border:0;border-radius:50%;font-size:22px;color:#fff;cursor:pointer;background:linear-gradient(135deg,#ff2f92,#654cff);box-shadow:0 8px 28px #0009}
button:active{transform:scale(.9)}.title{font-size:12px;color:#aaa;margin-top:8px}.hint{margin-top:18px;font-size:11px;color:#777}
#enter{position:fixed;inset:0;display:grid;place-items:center;background:#02030a;z-index:5}.enterBtn{width:auto;height:auto;border-radius:18px;padding:14px 24px;font-size:15px}
</style>
</head>
<body>
<canvas id="stars"></canvas><div class="orb o1"></div><div class="orb o2"></div>
<div id="enter"><button class="enterBtn" id="start">ENTER 3D BIO ✨</button></div>
<div class="scene"><div class="card" id="card">
<div class="ring"></div>
<div class="avatar"><img src="407.jpg" alt="SAYED ISLAM"></div>
<h1>SAYED ISLAM</h1>
<div class="sub"><div class="fireBio">
<span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span><span class="flame"></span>
<span class="fireText">জীবন চলছে, অজানা এক গন্তব্যে.!</span>
</div></div>
<div class="socials">
<a class="social fb" href="https://www.facebook.com/Sayedislam63" target="_blank" rel="noopener">🔵 Facebook</a>
<a class="social ig" href="https://www.instagram.com/sayedislam6385/" target="_blank" rel="noopener">📸 Instagram</a>
</div>
<div class="music"><button id="play">▶</button><div class="title">MY MUSIC</div><audio id="audio" src="song.mp3" preload="metadata"></audio></div>
<div class="hint">Touch / move your finger for 3D effect ✨</div>
</div></div>
<script>
const c=document.getElementById('card'),audio=document.getElementById('audio'),play=document.getElementById('play');
const enter=document.getElementById('enter'),start=document.getElementById('start');
start.onclick=()=>{enter.style.display='none';audio.play().then(()=>play.textContent='❚❚').catch(()=>{})};
play.onclick=()=>{if(audio.paused){audio.play();play.textContent='❚❚'}else{audio.pause();play.textContent='▶'}};
audio.onended=()=>play.textContent='▶';
function tilt(x,y){const r=c.getBoundingClientRect(),dx=(x-r.left-r.width/2)/(r.width/2),dy=(y-r.top-r.height/2)/(r.height/2);c.style.transform=`rotateX(${-dy*10}deg) rotateY(${dx*10}deg) translateZ(8px)`}
addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));addEventListener('touchmove',e=>{let t=e.touches[0];tilt(t.clientX,t.clientY)},{passive:true});addEventListener('mouseleave',()=>c.style.transform='');
const cv=document.getElementById('stars'),ctx=cv.getContext('2d');let pts=[];
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);pts=Array.from({length:Math.min(100,Math.floor(innerWidth/4))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.3,s:Math.random()*.5+.15}))}
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of pts){p.y-=p.s;if(p.y<0)p.y=innerHeight;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(255,255,255,.65)';ctx.fill()}requestAnimationFrame(draw)}
addEventListener('resize',resize);resize();draw();
</script>
</body>
</html>
