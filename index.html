<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SAYED ISLAM • 3D BIO</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a}
body{display:grid;place-items:center;font-family:Arial,sans-serif;color:#fff}
.stage{position:fixed;inset:0;display:grid;place-items:center;perspective:1400px;background:#01020a}
.card{
  position:relative;width:min(100vw,1024px);height:min(100vh,1536px);
  aspect-ratio:2/3;max-height:100vh;max-width:100vw;
  transform-style:preserve-3d;transition:transform .12s ease-out;
  overflow:hidden;background:#000 url("4596.png") center/cover no-repeat;
  box-shadow:0 0 70px #006dff55,0 0 120px #ff00c855;
}
.card:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(115deg,transparent 20%,#00eaff16 42%,transparent 50%,#ff19d018 72%,transparent 82%);
  background-size:220% 220%;animation:sweep 5s linear infinite;mix-blend-mode:screen
}
.card:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  box-shadow:inset 0 0 70px #00aaff55,inset 0 0 100px #ff00aa33
}
@keyframes sweep{0%{background-position:-120% 0}100%{background-position:120% 0}}

.hot{
  position:absolute;z-index:5;cursor:pointer;text-decoration:none;
  background:transparent;border:0;padding:0
}
.fb{left:10%;right:51%;top:67%;height:7.5%}
.ig{left:51%;right:10%;top:67%;height:7.5%}
.music{left:9%;right:9%;top:75%;height:13%}

.musicBtn{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:14%;aspect-ratio:1;border-radius:50%;
  border:1px solid #9beaff66;background:#ffffff08;
  box-shadow:0 0 18px #00eaff88,0 0 35px #a500ff66;
  animation:pulse 1.7s ease-in-out infinite;
  pointer-events:none
}
.musicBtn:after{
  content:"▶";position:absolute;left:50%;top:50%;transform:translate(-42%,-50%);
  font-size:clamp(18px,3vw,34px);color:white;text-shadow:0 0 15px #00eaff
}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.08);box-shadow:0 0 28px #00eaffcc,0 0 55px #ff00dd99}}

.nameGlow{
  position:absolute;z-index:4;left:7%;right:7%;top:36.5%;height:12%;
  display:grid;place-items:center;pointer-events:none;
  font-size:clamp(28px,7vw,78px);font-weight:1000;letter-spacing:.04em;
  color:transparent;-webkit-text-stroke:1px #ffffff55;
  background:linear-gradient(90deg,#00eaff,#fff,#ff22d9,#ff9d00,#00eaff);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;
  filter:drop-shadow(0 0 10px #00eaff88) drop-shadow(0 0 18px #ff00c866);
  animation:nameColor 3.5s linear infinite;
  mix-blend-mode:screen
}
@keyframes nameColor{to{background-position:300% center}}

.tip{
 position:fixed;left:50%;bottom:10px;transform:translateX(-50%);
 z-index:20;color:#ffffff99;font-size:11px;background:#0008;
 padding:6px 10px;border-radius:20px;backdrop-filter:blur(8px)
}
audio{display:none}
@media(max-width:600px){
 .card{width:100vw;height:100vh;background-size:100% 100%}
 .nameGlow{top:36%;font-size:clamp(25px,8vw,48px)}
}
</style>
</head>
<body>
<div class="stage">
  <div class="card" id="card">
    <div class="nameGlow">SAYED ISLAM</div>

    <!-- ছবির ওপর অদৃশ্য clickable areas -->
    <a class="hot fb" href="https://www.facebook.com/Sayedislam63" target="_blank" rel="noopener" aria-label="Facebook"></a>
    <a class="hot ig" href="https://www.instagram.com/sayedislam6385/" target="_blank" rel="noopener" aria-label="Instagram"></a>

    <button class="hot music" id="musicArea" aria-label="Play music">
      <span class="musicBtn"></span>
    </button>

    <audio id="audio" src="song.mp3" preload="metadata" loop></audio>
  </div>
</div>
<div class="tip">Touch / move your finger for 3D effect ✨</div>

<script>
const card=document.getElementById('card');
const audio=document.getElementById('audio');
const musicArea=document.getElementById('musicArea');

function tilt(x,y){
  const r=card.getBoundingClientRect();
  const dx=(x-r.left-r.width/2)/(r.width/2);
  const dy=(y-r.top-r.height/2)/(r.height/2);
  card.style.transform=`rotateX(${-dy*7}deg) rotateY(${dx*7}deg) scale(1.01)`;
}
addEventListener('mousemove',e=>tilt(e.clientX,e.clientY));
addEventListener('touchmove',e=>{
  const t=e.touches[0]; if(t) tilt(t.clientX,t.clientY);
},{passive:true});
addEventListener('mouseleave',()=>card.style.transform='');
addEventListener('touchend',()=>card.style.transform='');

musicArea.addEventListener('click',()=>{
  if(audio.paused){
    audio.play().catch(()=>{});
  }else{
    audio.pause();
  }
});

/* প্রথম user tap/click-এর পর গান চালানোর চেষ্টা */
document.addEventListener('click',()=>{
  if(audio.paused) audio.play().catch(()=>{});
},{once:true});
</script>
</body>
</html>
